<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會議預約平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #f0f0f5;
      --text-muted: #888899;
      --danger: #f87171;
      --success: #4ade80;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
    }

    /* ── 登入頁 ── */
    #login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 40%, #1e1a4a 0%, #0f0f11 70%);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 56px 48px;
      width: 420px;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }

    .login-card h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, #7c6af7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-card p {
      color: var(--text-muted);
      margin-bottom: 40px;
      font-size: 0.9rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── 按鈕 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-google {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }
    .btn-google:hover { background: #f5f5f5; transform: translateY(-1px); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-sm {
      padding: 7px 14px;
      font-size: 0.8rem;
      width: auto;
    }

    /* ── Email 登入表單 ── */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    /* ── 主應用 ── */
    #app { display: none; }

    /* ── Navbar ── */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #a78bfa, #7c6af7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ── 主內容 ── */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
    }

    /* ── Tab ── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 32px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── 會議卡片 ── */
    .meetings-grid {
      display: grid;
      gap: 16px;
    }

    .meeting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .meeting-card:hover { border-color: var(--accent); }

    .meeting-card h3 {
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .meeting-meta {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
    }
    .close-btn:hover { color: var(--text); }

    /* ── 時段選擇 ── */
    .slot-list { display: grid; gap: 8px; margin: 16px 0; }

    .slot-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .slot-item:hover { border-color: var(--accent); }
    .slot-item.selected { border-color: var(--accent); background: rgba(124,106,247,0.1); }

    .slot-item input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }

    .slot-date { font-weight: 500; font-size: 0.9rem; }
    .slot-time { color: var(--text-muted); font-size: 0.8rem; }

    /* ── 新建會議：時段輸入 ── */
    .slot-inputs { display: grid; gap: 8px; margin-bottom: 8px; }

    .slot-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .remove-slot {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .add-slot-btn {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 8px;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .add-slot-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 0.9rem;
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s;
      max-width: 320px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: var(--success); color: var(--success); }
    #toast.error { border-color: var(--danger); color: var(--danger); }

    /* ── 空狀態 ── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { margin-bottom: 24px; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tag {
      display: inline-block;
      background: rgba(124,106,247,0.15);
      color: var(--accent2);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-closed { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
    .badge-open   { background: rgba(74,222,128,0.12); color: var(--success); border: 1px solid rgba(74,222,128,0.3); }
    .badge-confirmed { background: rgba(124,106,247,0.2); color: var(--accent2); border: 1px solid var(--accent); }
    .confirmed-banner {
      background: rgba(124,106,247,0.12);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: var(--accent2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meeting-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      color: var(--accent2);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-share:hover { background: rgba(124,106,247,0.2); }

    .share-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 12px 0;
    }
    .share-url {
      flex: 1;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--accent2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-copy {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent2);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: var(--accent); color: #fff; }
    .btn-copy.copied { background: var(--success); border-color: var(--success); color: #000; }

    /* 統計 */
    .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .stat-num { font-size: 1.8rem; font-weight: 700; color: var(--accent2); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-label { font-size: 0.8rem; color: var(--text-muted); width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; }
    .bar-count { font-size: 0.8rem; font-weight: 500; color: var(--text); width: 36px; text-align: right; }
    .resp-list { display: grid; gap: 8px; margin-top: 12px; }
    .resp-item { display: flex; align-items: flex-start; gap: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .resp-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(124,106,247,0.2); color: var(--accent2); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }
    .resp-name { font-size: 0.9rem; font-weight: 500; }
    .resp-slots { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    /* 受邀者頁 */
    #invite-page { display: none; min-height: 100vh; background: radial-gradient(ellipse at 40% 60%, #1a1040 0%, #0f0f11 70%); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }

    .deadline-preset {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      padding: 5px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .deadline-preset:hover { border-color: var(--accent); color: var(--accent2); }
    .deadline-preset.active { background: rgba(124,106,247,0.15); border-color: var(--accent); color: var(--accent2); }

    /* ── Outlook 行事曆按鈕 ── */
    .btn-outlook {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      color: #0078d4;
      border: 1px solid #0078d4;
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-outlook:hover { background: rgba(0,120,212,0.15); }
    .btn-outlook svg { flex-shrink: 0; }

    .outlook-export-section {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0,120,212,0.07);
      border: 1px solid rgba(0,120,212,0.3);
      border-radius: 10px;
    }
    .outlook-export-section h4 {
      font-size: 0.85rem;
      color: #60aaee;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .outlook-slots-list {
      display: grid;
      gap: 8px;
    }
    .outlook-slot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<!-- ══ 登入頁 ══ -->
<div id="login-page">
  <div class="login-card">
    <h1>會議預約平台</h1>
    <p>請登入以繼續使用</p>

    <button class="btn btn-google" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      使用 Google 帳號登入
    </button>

    <div class="divider">或用 Email 登入</div>

    <div id="email-login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" id="btn-login" style="margin-bottom:10px">登入</button>
      <button class="btn btn-outline" id="btn-signup">註冊新帳號</button>
    </div>
  </div>
</div>

<!-- ══ 主應用 ══ -->
<div id="app">
  <nav class="navbar">
    <span class="navbar-brand">會議預約平台</span>
    <div class="navbar-right">
      <span class="user-badge" id="user-email-badge"></span>
      <button class="btn btn-outline btn-sm" id="btn-logout">登出</button>
    </div>
  </nav>

  <div class="main">
    <div class="page-header">
      <h2 class="page-title">所有會議</h2>
      <button class="btn btn-primary btn-sm" id="btn-new-meeting">＋ 新增會議</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="all">全部會議</div>
      <div class="tab" data-tab="mine">我的預約</div>
    </div>

    <div id="meetings-container">
      <div class="loading"><div class="spinner"></div>載入中...</div>
    </div>
  </div>
</div>

<!-- ══ Modal: 新增會議 ══ -->
<div class="modal-overlay" id="modal-new-meeting">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">新增會議</span>
      <button class="close-btn" data-close="modal-new-meeting">×</button>
    </div>
    <div class="form-group">
      <label>會議標題 *</label>
      <input type="text" id="nm-title" placeholder="Q3 產品規劃會議" />
    </div>
    <div class="form-group">
      <label>主辦人 *</label>
      <input type="text" id="nm-organizer" placeholder="王小明" />
    </div>
    <div class="form-group">
      <label>地點 *</label>
      <input type="text" id="nm-location" placeholder="B1 會議室 / Google Meet" />
    </div>
    <div class="form-group">
      <label>說明</label>
      <textarea id="nm-desc" placeholder="會議目的與備注..."></textarea>
    </div>
    <div class="form-group">
      <label>投票截止時間（選填）</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="deadline-presets">
        <button type="button" class="deadline-preset" data-hours="24">24 小時後</button>
        <button type="button" class="deadline-preset" data-hours="48">2 天後</button>
        <button type="button" class="deadline-preset" data-hours="72">3 天後</button>
        <button type="button" class="deadline-preset" data-hours="168">7 天後</button>
        <button type="button" class="deadline-preset" data-custom="1">自訂時間</button>
      </div>
      <input type="datetime-local" id="nm-deadline" style="display:none" />

<!-- ══ Toast ══ -->
<div id="toast"></div>

<script>
  // ── Supabase 初始化 ──
  const SUPABASE_URL = 'https://gababbyxmixripxsruoj.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhYmFiYnl4bWl4cmlweHNydW9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNjUxODksImV4cCI6MjA5Mjg0MTE4OX0.xfvdHRBFTbGKfgq9hwUkO_OFYjjq9LIuOciw6dI4kps';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let currentTab = 'all';
  let bookingMeetingId = null;

  // ── Toast ──
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = '', 3000);
  }

  function getInviteId() {
    // 1. 先從 URL hash 或 query string 取得
    const fromHash = window.location.hash.match(/invite=([^&]+)/);
    if (fromHash) {
      sessionStorage.setItem('pendingInviteId', fromHash[1]);
      return fromHash[1];
    }
    const fromQuery = new URLSearchParams(window.location.search).get('invite');
    if (fromQuery) {
      sessionStorage.setItem('pendingInviteId', fromQuery);
      return fromQuery;
    }
    // 2. OAuth redirect 後 hash 消失，從 sessionStorage 救回
    return sessionStorage.getItem('pendingInviteId') || null;
  }

  function showPage(page) {
    ['login-page','app','invite-page'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    if (page === 'login') document.getElementById('login-page').style.display = 'flex';
    else if (page === 'app') document.getElementById('app').style.display = 'block';
    else if (page === 'invite') document.getElementById('invite-page').style.display = 'block';
  }

  // ── Auth state ──
  // inviteOnly = 這個 session 是從分享連結進來的，只能看單一會議
  let inviteOnly = false;

  sb.auth.onAuthStateChange(async (event, session) => {
    currentUser = session?.user ?? null;
    const inviteId = getInviteId();
    if (currentUser) {
      document.getElementById('user-email-badge').textContent = currentUser.email;
      if (inviteId) {
        inviteOnly = true;
        sessionStorage.removeItem('pendingInviteId'); // 已用完，清掉
        showPage('invite');
        setupInvitePage(inviteId, currentUser);
      } else if (inviteOnly) {
        // 受邀者登出再登入，沒有 inviteId → 回登入頁，不給進主畫面
        showPage('login');
      } else {
        showPage('app');
        loadMeetings();
      }
    } else {
      inviteOnly = false;
      if (inviteId) {
        showPage('invite');
        setupInviteLogin(inviteId);
      } else {
        sessionStorage.removeItem('pendingInviteId'); // 確保登出時清掉
        showPage('login');
      }
    }
  });

  // ── 受邀者登入畫面 ──
  async function setupInviteLogin(meetingId) {
    document.getElementById('invite-login-section').style.display = 'block';
    document.getElementById('invite-form-section').style.display = 'none';
    const { data: m } = await sb.from('meetings').select('title,description').eq('id', meetingId).single();
    if (m) {
      document.getElementById('invite-meeting-title').textContent = m.title;
      document.getElementById('invite-meeting-desc').textContent = m.description || '';
    }
    document.getElementById('btn-invite-google').onclick = async () => {
      // 先存 inviteId，OAuth redirect 後 hash 會消失
      sessionStorage.setItem('pendingInviteId', meetingId);
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://oooops2121.github.io/meeting-tool/' }
      });
    };
  }

  // ── 回首頁 ──
  function goHome() {
    sessionStorage.removeItem('pendingInviteId');
    if (inviteOnly) {
      // 受邀者「回首頁」只登出，不給進主列表
      sb.auth.signOut();
    } else {
      window.location.href = 'https://oooops2121.github.io/meeting-tool/';
    }
  }

  // ── 我的預約 側拉板 ──
  async function openMyMeetingsPanel() {
    document.getElementById('my-meetings-panel').style.display = 'block';
    const list = document.getElementById('my-meetings-list');
    list.innerHTML = '<div class="loading"><div class="spinner"></div>載入中...</div>';

    const { data: myBookings } = await sb.from('bookings').select('*').eq('user_id', currentUser.id);
    if (!myBookings || !myBookings.length) {
      list.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;text-align:center;padding:24px 0">你目前還沒有填寫任何預約</div>';
      return;
    }
    const meetingIds = [...new Set(myBookings.map(b => b.meeting_id))];
    const { data: meetings } = await sb.from('meetings').select('*').in('id', meetingIds);
    const mtgMap = {};
    (meetings || []).forEach(m => mtgMap[m.id] = m);

    // 取得所有相關 confirmed slots
    const confirmedIds = (meetings || []).map(m => m.confirmed_slot_id).filter(Boolean);
    let confirmedMap = {};
    if (confirmedIds.length) {
      const { data: cs } = await sb.from('time_slots').select('*').in('id', confirmedIds);
      (cs || []).forEach(s => confirmedMap[s.id] = s);
    }

    list.innerHTML = myBookings.map(b => {
      const m = mtgMap[b.meeting_id];
      if (!m) return '';
      const now = new Date();
      const deadline = m.vote_deadline ? new Date(m.vote_deadline) : null;
      const isClosed = deadline && now > deadline;
      const confirmedSlot = m.confirmed_slot_id && confirmedMap[m.confirmed_slot_id];
      const slotCount = (b.slot_ids || []).length;

      let statusHtml = '';
      if (confirmedSlot) {
        statusHtml = `<div style="margin-top:8px;background:rgba(124,106,247,0.1);border:1px solid var(--accent);border-radius:6px;padding:8px 10px;font-size:0.8rem;color:var(--accent2)">
          📅 已確認：${formatDate(confirmedSlot.slot_date)} ${confirmedSlot.slot_start.slice(0,5)}–${confirmedSlot.slot_end.slice(0,5)}
        </div>`;
      } else if (isClosed) {
        statusHtml = `<div style="margin-top:6px;font-size:0.78rem;color:var(--danger)">⏰ 投票已截止，等待主辦人確認</div>`;
      } else {
        statusHtml = `<div style="margin-top:6px;font-size:0.78rem;color:var(--success)">● 投票中${deadline ? '，截止 ' + deadline.toLocaleDateString('zh-TW') : ''}</div>`;
      }

      return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
        <div style="font-weight:500;font-size:0.9rem;margin-bottom:2px">${escHtml(m.title)}</div>
        <div style="font-size:0.78rem;color:var(--text-muted)">📍 ${escHtml(m.location)}　👤 ${escHtml(m.organizer)}</div>
        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px">你勾選了 ${slotCount} 個時段</div>
        ${statusHtml}
      </div>`;
    }).join('');
  }

  function closeMyMeetingsPanel() {
    document.getElementById('my-meetings-panel').style.display = 'none';
  }

  // ── 受邀者填寫頁 ──
  async function setupInvitePage(meetingId, user) {
    document.getElementById('invite-login-section').style.display = 'none';
    document.getElementById('invite-form-section').style.display = 'block';
    document.getElementById('invite-user-badge').textContent = user.email;
    document.getElementById('invite-user-badge').style.display = '';
    document.getElementById('btn-invite-home').style.display = '';
    document.getElementById('btn-invite-mymeetings').style.display = '';
    document.getElementById('btn-invite-logout').style.display = '';
    document.getElementById('btn-invite-logout').onclick = () => sb.auth.signOut();

    const { data: m } = await sb.from('meetings').select('*').eq('id', meetingId).single();
    if (!m) return toast('找不到此會議', 'error');
    document.getElementById('invite-form-title').textContent = m.title;
    document.getElementById('invite-form-desc').textContent = m.description || '';
    document.getElementById('invite-organizer-info').textContent = `主辦人：${m.organizer}　地點：${m.location}`;

    const now = new Date();
    const deadline = m.vote_deadline ? new Date(m.vote_deadline) : null;
    const isClosed = deadline && now > deadline;

    // 若已確認時段，顯示結果
    if (m.confirmed_slot_id) {
      const { data: cs } = await sb.from('time_slots').select('*').eq('id', m.confirmed_slot_id).single();
      if (cs) {
        document.getElementById('invite-already-msg').style.display = 'block';
        document.getElementById('invite-already-msg').style.background = 'rgba(124,106,247,0.1)';
        document.getElementById('invite-already-msg').style.borderColor = 'var(--accent)';
        document.getElementById('invite-already-msg').style.color = 'var(--accent2)';
        document.getElementById('invite-already-msg').textContent = `📅 最終會議時間已確認：${formatDate(cs.slot_date)} ${cs.slot_start.slice(0,5)} – ${cs.slot_end.slice(0,5)}`;
        
        // 加入 Outlook 按鈕
        let outlookBtn = document.getElementById('invite-outlook-btn');
        if (!outlookBtn) {
          outlookBtn = document.createElement('button');
          outlookBtn.id = 'invite-outlook-btn';
          outlookBtn.className = 'btn-outlook';
          outlookBtn.style.marginTop = '12px';
          outlookBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="#0078d4" stroke-width="2"/><path d="M3 9h18" stroke="#0078d4" stroke-width="2"/><path d="M8 2v4M16 2v4" stroke="#0078d4" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15" r="2" fill="#0078d4"/></svg> 加入 Outlook 行事曆`;
          document.getElementById('invite-already-msg').insertAdjacentElement('afterend', outlookBtn);
        }
        outlookBtn.onclick = () => exportToOutlook(m.title, m.description||'', m.location, cs.slot_date, cs.slot_start, cs.slot_end, m.organizer);
        document.getElementById('invite-slots').innerHTML = '';
        document.getElementById('btn-invite-submit').style.display = 'none';
        return;
      }
    }

    // 截止提示
    if (isClosed) {
      document.getElementById('invite-already-msg').style.display = 'block';
      document.getElementById('invite-already-msg').style.background = 'rgba(248,113,113,0.08)';
      document.getElementById('invite-already-msg').style.borderColor = 'var(--danger)';
      document.getElementById('invite-already-msg').style.color = 'var(--danger)';
      document.getElementById('invite-already-msg').textContent = `⏰ 投票已於 ${deadline.toLocaleDateString('zh-TW')} 截止，無法再修改回應。`;
      document.getElementById('btn-invite-submit').style.display = 'none';
    }

    const { data: slots } = await sb.from('time_slots').select('*').eq('meeting_id', meetingId).order('slot_date').order('slot_start');
    const { data: existing } = await sb.from('bookings').select('*').eq('meeting_id', meetingId).eq('user_id', user.id).maybeSingle();
    const prevIds = new Set(existing?.slot_ids || []);

    if (existing && !isClosed) {
      document.getElementById('invite-already-msg').style.display = 'block';
      document.getElementById('invite-name').value = existing.user_name || '';
      document.getElementById('invite-note').value = existing.note || '';
    }

    // ── 顯示投票結果 ──
    const { data: allBookings } = await sb.from('bookings').select('slot_ids').eq('meeting_id', meetingId);
    if (allBookings && allBookings.length && slots && slots.length) {
      const slotCount = {};
      slots.forEach(s => { slotCount[s.id] = 0; });
      allBookings.forEach(b => {
        const ids = Array.isArray(b.slot_ids) ? b.slot_ids : [];
        ids.forEach(sid => { if (slotCount[sid] !== undefined) slotCount[sid]++; });
      });
      const maxCount = Math.max(...Object.values(slotCount), 1);
      document.getElementById('invite-vote-results').style.display = 'block';
      document.getElementById('invite-results-note').textContent = `共 ${allBookings.length} 人已填寫回應`;
      document.getElementById('invite-results-bars').innerHTML = slots.map(s => {
        const count = slotCount[s.id] || 0;
        const pct = Math.round(count / maxCount * 100);
        const isTop = count === maxCount && count > 0;
        return `<div class="bar-row" style="margin-bottom:10px">
          <div class="bar-label" style="width:120px;font-size:0.78rem;${isTop ? 'color:var(--accent2);font-weight:500' : ''}" title="${formatDate(s.slot_date)}">${formatDateShort(s.slot_date)} ${s.slot_start.slice(0,5)}</div>
          <div class="bar-track" style="flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${isTop ? 'linear-gradient(90deg,var(--accent),var(--accent2))' : 'var(--border)'};border-radius:4px;transition:width 0.5s ease"></div>
          </div>
          <div style="width:36px;text-align:right;font-size:0.78rem;color:${isTop ? 'var(--accent2)' : 'var(--text-muted)'};font-weight:${isTop ? '600' : '400'}">${count}</div>
        </div>`;
      }).join('');
    }

    const slotList = document.getElementById('invite-slots');
    slotList.innerHTML = (slots || []).map(s => `
      <label class="slot-item ${prevIds.has(s.id) ? 'selected' : ''}" onclick="${isClosed ? '' : "this.classList.toggle('selected')"}">
        <input type="checkbox" value="${s.id}" ${prevIds.has(s.id) ? 'checked' : ''} ${isClosed ? 'disabled' : ''} />
        <div>
          <div class="slot-date">${formatDate(s.slot_date)}</div>
          <div class="slot-time">${s.slot_start.slice(0,5)} – ${s.slot_end.slice(0,5)}</div>
        </div>
      </label>`).join('') || '<p style="color:var(--text-muted);font-size:0.85rem">此會議尚未設定時段</p>';

    if (!isClosed) {
      document.getElementById('btn-invite-submit').onclick = async () => {
        const name = document.getElementById('invite-name').value.trim();
        const note = document.getElementById('invite-note').value.trim();
        const slotIds = [...document.querySelectorAll('#invite-slots input:checked')].map(i => i.value);
        if (!name) return toast('請填寫姓名', 'error');
        if (!slotIds.length) return toast('請至少選一個時段', 'error');
        const { error } = await sb.from('bookings').upsert({
          meeting_id: meetingId, user_id: user.id, user_name: name,
          user_email: user.email, slot_ids: slotIds, attendees: 1, note: note || null
        }, { onConflict: 'meeting_id,user_id' });
        if (error) return toast(error.message, 'error');
        toast('回應已送出！感謝您 ✓');
        document.getElementById('btn-invite-submit').textContent = '✓ 已送出';
        document.getElementById('btn-invite-submit').disabled = true;
      };
    }
  }

  // ── 統計 Modal ──
  async function openStatsModal(meetingId, title) {
    document.getElementById('stats-title').textContent = title + ' — 回應統計';
    document.getElementById('stats-body').innerHTML = '<div class="loading"><div class="spinner"></div>載入中...</div>';
    openModal('modal-stats');

    const { data: slots, error: sErr } = await sb.from('time_slots').select('*').eq('meeting_id', meetingId).order('slot_date').order('slot_start');
    const { data: bookings, error: bErr } = await sb.from('bookings').select('*').eq('meeting_id', meetingId);
    const { data: mtg } = await sb.from('meetings').select('vote_deadline,confirmed_slot_id').eq('id', meetingId).single();

    const errMsg = bErr?.message || sErr?.message || '';
    if (bErr || sErr) {
      const isRLS = errMsg.includes('permission') || errMsg.includes('policy') || errMsg.includes('users');

        ? `<div class="empty-state" style="padding:32px 0">
            <div class="icon">🔒</div>
            <p style="margin-bottom:16px">Supabase RLS 權限不足，需要調整資料庫設定</p>
            <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:left;font-size:0.82rem;color:var(--text-muted);line-height:2;max-width:400px;margin:0 auto">
              請至 <strong style="color:var(--accent2)">Supabase → Authentication → Policies</strong><br>
              找到 <strong style="color:var(--accent2)">bookings</strong> table，新增 SELECT policy：<br>
              名稱：<code style="background:#0f0f11;padding:2px 6px;border-radius:4px;color:#4ade80">Allow read for authenticated</code><br>
              條件：<code style="background:#0f0f11;padding:2px 6px;border-radius:4px;color:#4ade80">auth.role() = 'authenticated'</code>
            </div>
          </div>`
        : `<div class="empty-state" style="padding:40px 0"><div class="icon">⚠️</div><p>載入失敗：${errMsg}</p></div>`;

    }

    if (!bookings || !bookings.length) {

      return;
    }

    const slotMap = {};
    (slots||[]).forEach(s => slotMap[s.id] = s);

    const slotCount = {};
    (slots||[]).forEach(s => { slotCount[s.id] = 0; });

    bookings.forEach(b => {
      const ids = Array.isArray(b.slot_ids) ? b.slot_ids : (typeof b.slot_ids === 'string' ? JSON.parse(b.slot_ids) : []);

      });

    const maxCount = Math.max(...Object.values(slotCount), 1);
    const bestEntry = Object.entries(slotCount).sort((a,b) => b[1]-a[1])[0];
    const bestId = bestEntry?.[0];
    const bestSlot = bestId && slotMap[bestId];
    const totalAttendees = bookings.reduce((sum, b) => sum + (parseInt(b.attendees) || 1), 0);

    const now = new Date();
    const deadline = mtg?.vote_deadline ? new Date(mtg.vote_deadline) : null;
    const isClosed = deadline && now > deadline;
    const isConfirmed = !!mtg?.confirmed_slot_id;

    document.getElementById('stats-body').innerHTML = `
      ${deadline ? `<div style="font-size:0.82rem;padding:6px 12px;border-radius:6px;margin-bottom:16px;display:inline-flex;align-items:center;gap:5px;${isClosed ? 'background:rgba(248,113,113,0.1);color:var(--danger);border:1px solid rgba(248,113,113,0.3)' : 'background:rgba(251,191,36,0.1);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)'}">⏱ ${isClosed ? '投票已截止：' : '截止日期：'}${deadline.toLocaleDateString('zh-TW', {year:'numeric',month:'numeric',day:'numeric'})} ${deadline.toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'})}</div>` : ''}
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${bookings.length}</div><div class="stat-label">已回應人數</div></div>
        <div class="stat-card"><div class="stat-num">${totalAttendees}</div><div class="stat-label">總出席人數</div></div>
        <div class="stat-card"><div class="stat-num">${(slots||[]).length}</div><div class="stat-label">可選時段數</div></div>
      </div>
      ${bestSlot ? `<div style="background:rgba(124,106,247,0.1);border:1px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:0.88rem;color:var(--accent2)">🏆 最多人可以的時段：<strong>${formatDate(bestSlot.slot_date)} ${bestSlot.slot_start.slice(0,5)}–${bestSlot.slot_end.slice(0,5)}</strong>（${bestEntry[1]} 人）</div>` : ''}
      <div style="margin-bottom:20px">
        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;font-weight:500">各時段可用人數</div>
        ${(slots||[]).map(s => {
          const count = slotCount[s.id] || 0;
          const pct = Math.round(count / maxCount * 100);
          return `
          <div class="bar-row">
            <div class="bar-label" title="${formatDate(s.slot_date)} ${s.slot_start.slice(0,5)}">${formatDateShort(s.slot_date)} ${s.slot_start.slice(0,5)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-count">${count}/${bookings.length}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;font-weight:500">回應紀錄</div>
      <div class="resp-list">
        ${bookings.map(b => {
          const initials = (b.user_name || b.user_email || '?').slice(0,2);
          const ids = Array.isArray(b.slot_ids) ? b.slot_ids : (typeof b.slot_ids === 'string' ? JSON.parse(b.slot_ids) : []);
          const selectedSlots = ids.map(sid => slotMap[sid]).filter(Boolean)
            .map(s => `${formatDateShort(s.slot_date)} ${s.slot_start.slice(0,5)}`).join('、');
          return `<div class="resp-item">
            <div class="resp-avatar">${escHtml(initials)}</div>
            <div style="min-width:0">
              <div class="resp-name">${escHtml(b.user_name || b.user_email)}</div>
              <div class="resp-slots">可以：${selectedSlots || '（未選時段）'}${b.attendees > 1 ? `（${b.attendees}人）` : ''}</div>
              ${b.note ? `<div class="resp-slots">備注：${escHtml(b.note)}</div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${!isConfirmed ? `<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;font-weight:500">確認最終會議時段（確認後受邀者將看到結果）</div>
        <div style="display:grid;gap:8px">
          ${(slots||[]).sort((a,b) => (slotCount[b.id]||0)-(slotCount[a.id]||0)).map(s => `
            <button onclick="confirmSlot('${meetingId}','${s.id}')" style="display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;font-family:inherit;color:var(--text);font-size:0.85rem;transition:all 0.2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
              <span>${formatDate(s.slot_date)} ${s.slot_start.slice(0,5)}–${s.slot_end.slice(0,5)}</span>
              <span style="color:var(--accent2);font-size:0.78rem">${slotCount[s.id]||0} 人可以 → 點擊確認</span>
            </button>`).join('')}
        </div>
      </div>` : (() => {
        // 找到已確認的 slot
        const cSlot = (slots||[]).find(s => s.id === mtg.confirmed_slot_id);
        if (!cSlot) return '';
        const { data: mtgFull } = { data: null }; // mtg already has title from stats-title
        const title = document.getElementById('stats-title').textContent.replace(' — 回應統計','');
        return `<div class="outlook-export-section" style="margin-top:20px">
          <h4>📅 新增已確認時段到行事曆</h4>
          <div class="outlook-slots-list">
            <div class="outlook-slot-row">
              <span>${formatDate(cSlot.slot_date)} ${cSlot.slot_start.slice(0,5)} – ${cSlot.slot_end.slice(0,5)}</span>
              <button class="btn-outlook" onclick="exportToOutlook('${escAttr(title)}','','','${cSlot.slot_date}','${cSlot.slot_start}','${cSlot.slot_end}','')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="#0078d4" stroke-width="2"/><path d="M3 9h18" stroke="#0078d4" stroke-width="2"/><path d="M8 2v4M16 2v4" stroke="#0078d4" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15" r="2" fill="#0078d4"/></svg>
                加入 Outlook
              </button>
            </div>
          </div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:10px">下載 .ics 檔案後，用 Outlook 開啟即可加入行事曆</div>
        </div>`;
      })()}`;

    document.getElementById('modal-stats').dataset.meetingId = meetingId;
  }

  async function confirmSlot(meetingId, slotId) {
    if (!confirm('確認選擇此時段作為最終會議時間？確認後所有人將看到結果。')) return;
    const { error } = await sb.from('meetings').update({ confirmed_slot_id: slotId }).eq('id', meetingId);
    if (error) return toast(error.message, 'error');
    toast('已確認最終時段！所有人的「我的預約」將顯示結果 ✓');
    closeModal('modal-stats');
    loadMeetings();

    // 詢問是否要匯出到 Outlook
    const { data: slot } = await sb.from('time_slots').select('*').eq('id', slotId).single();
    const { data: mtg } = await sb.from('meetings').select('title,description,location,organizer').eq('id', meetingId).single();
    if (slot && mtg) {
      setTimeout(() => {
        if (confirm(`是否要將此會議加入到 Outlook 行事曆？\n\n📅 ${mtg.title}\n🕐 ${formatDate(slot.slot_date)} ${slot.slot_start.slice(0,5)} – ${slot.slot_end.slice(0,5)}\n📍 ${mtg.location}`)) {
          exportToOutlook(mtg.title, mtg.description||'', mtg.location, slot.slot_date, slot.slot_start, slot.slot_end, mtg.organizer);
        }
      }, 400);
    }
  }

  // ── Outlook 行事曆匯出 ──
  // 支援新版（Microsoft 365 / Outlook.com 網頁深連結）和舊版（.ics 下載）

  function exportToOutlook(title, description, location, slotDate, slotStart, slotEnd, organizer) {
    // 移除舊 popup
    const old = document.getElementById('outlook-picker');
    if (old) old.remove();

    // 建立選擇 popup
    const popup = document.createElement('div');
    popup.id = 'outlook-picker';
    popup.style.cssText = `
      position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,0.6);animation:fadeIn 0.15s ease
    `;
    popup.innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:340px;box-shadow:0 24px 60px rgba(0,0,0,0.5)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-family:'DM Serif Display',serif;font-size:1.1rem">加入 Outlook 行事曆</span>
          <button onclick="document.getElementById('outlook-picker').remove()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.3rem;line-height:1">×</button>
        </div>
        <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:20px">請選擇你使用的 Outlook 版本</p>

        <div style="display:grid;gap:10px">
          <!-- 新版：網頁版 / Microsoft 365 -->
          <button id="btn-outlook-web" style="display:flex;align-items:center;gap:12px;background:rgba(0,120,212,0.08);border:1px solid rgba(0,120,212,0.4);border-radius:10px;padding:14px 16px;cursor:pointer;font-family:inherit;color:var(--text);text-align:left;transition:all 0.2s" onmouseover="this.style.background='rgba(0,120,212,0.18)'" onmouseout="this.style.background='rgba(0,120,212,0.08)'">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="2" width="10" height="10" rx="1.5" fill="#0078d4"/>
              <rect x="13" y="2" width="9" height="10" rx="1.5" fill="#50e6ff"/>
              <rect x="2" y="13" width="10" height="9" rx="1.5" fill="#50e6ff"/>
              <rect x="13" y="13" width="9" height="9" rx="1.5" fill="#0078d4"/>
            </svg>
            <div>
              <div style="font-size:0.88rem;font-weight:500;color:#60aaee">新版 Outlook（網頁版 / Microsoft 365）</div>
              <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px">直接在瀏覽器開啟 Outlook，點一下加入</div>
            </div>
          </button>

          <!-- 舊版：桌機版 .ics 下載 -->
          <button id="btn-outlook-desktop" style="display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;font-family:inherit;color:var(--text);text-align:left;transition:all 0.2s" onmouseover="this.style.borderColor='#0078d4'" onmouseout="this.style.borderColor='var(--border)'">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="3" width="22" height="18" rx="2" fill="#0078d4"/>
              <ellipse cx="12" cy="12" rx="6" ry="7" fill="white" opacity="0.95"/>
              <text x="12" y="16" text-anchor="middle" font-size="8" font-weight="bold" fill="#0078d4" font-family="sans-serif">O</text>
            </svg>
            <div>
              <div style="font-size:0.88rem;font-weight:500">舊版 Outlook（桌機版 2016/2019/2021）</div>
              <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px">下載 .ics 檔案，雙擊開啟即可匯入</div>
            </div>
          </button>
        </div>

        <p style="font-size:0.72rem;color:var(--text-muted);margin-top:14px;text-align:center">不確定版本？先試新版，不行再用舊版</p>
      </div>
    `;
    document.body.appendChild(popup);
    popup.addEventListener('click', e => { if (e.target === popup) popup.remove(); });

    // ── 新版：組 Outlook Web 深連結 ──
    document.getElementById('btn-outlook-web').addEventListener('click', () => {
      popup.remove();

      // 將本地日期時間視為台灣時間 (UTC+8) → 轉成 UTC ISO
      function localToUTC(dateStr, timeStr) {
        const [y,mo,d] = dateStr.split('-').map(Number);
        const [h,min]  = timeStr.split(':').map(Number);
        // UTC+8 → 減 8 小時
        const utc = new Date(Date.UTC(y, mo-1, d, h-8, min, 0));
        return utc.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
      }

      const start = localToUTC(slotDate, slotStart);
      const end   = localToUTC(slotDate, slotEnd);
      const params = new URLSearchParams({
        path      : '/calendar/action/compose',
        rru       : 'addevent',
        startdt   : start,
        enddt     : end,
        subject   : title,
        body      : `${description || ''}${organizer ? `\n主辦人：${organizer}` : ''}`,
        location  : location || '',
      });
      const url = `https://outlook.live.com/calendar/0/action/compose?${params.toString()}`;
      window.open(url, '_blank');
      toast('已在新分頁開啟 Outlook 網頁版 📅');
    });

    // ── 舊版：下載 .ics ──
    document.getElementById('btn-outlook-desktop').addEventListener('click', () => {
      popup.remove();

      function toIcalDate(dateStr, timeStr) {
        const [y,m,d] = dateStr.split('-');
        const [h,min] = timeStr.split(':');
        return `${y}${m.padStart(2,'0')}${d.padStart(2,'0')}T${h.padStart(2,'0')}${min.padStart(2,'0')}00`;
      }

      const dtStart = toIcalDate(slotDate, slotStart);
      const dtEnd   = toIcalDate(slotDate, slotEnd);
      const stamp   = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
      const uid     = `meeting-${Date.now()}@clhmeetingtools`;
      const esc     = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');

      const descFull = esc((description||'') + (organizer ? `\n主辦人：${organizer}` : ''));

      const icsLines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//會議預約平台//TW',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'X-WR-TIMEZONE:Asia/Taipei',
        'BEGIN:VTIMEZONE',
        'TZID:Asia/Taipei',
        'BEGIN:STANDARD',
        'DTSTART:19700101T000000',
        'TZOFFSETFROM:+0800',
        'TZOFFSETTO:+0800',
        'TZNAME:CST',
        'END:STANDARD',
        'END:VTIMEZONE',
        'BEGIN:VEVENT',
        `UID:${uid}`,
        `DTSTAMP:${stamp}`,
        `DTSTART;TZID=Asia/Taipei:${dtStart}`,
        `DTEND;TZID=Asia/Taipei:${dtEnd}`,
        `SUMMARY:${esc(title)}`,
        `DESCRIPTION:${descFull}`,
        `LOCATION:${esc(location)}`,
        ...(organizer ? [`ORGANIZER;CN="${esc(organizer)}":MAILTO:noreply@clhmeetingtools.com`] : []),
        'STATUS:CONFIRMED',
        'TRANSP:OPAQUE',
        'END:VEVENT',
        'END:VCALENDAR'
      ];

      const icsContent = icsLines.join('\r\n');
      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `${(title||'meeting').replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_')}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('已下載 .ics 檔案，雙擊即可匯入 Outlook 📅');
    });
  }

  // ── Google 登入 ──
  document.getElementById('btn-google').addEventListener('click', async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });

  });

  // ── Email 登入 ──
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return toast('請填寫 Email 和密碼', 'error');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) toast(error.message, 'error');
  });

  // ── Email 註冊 ──
  document.getElementById('btn-signup').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return toast('請填寫 Email 和密碼', 'error');
    if (password.length < 6) return toast('密碼至少 6 個字元', 'error');
    const { error } = await sb.auth.signUp({ email, password });
    if (error) toast(error.message, 'error');
    else toast('註冊成功！請確認信箱驗證信', 'success');
  });

  // ── 登出 ──
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await sb.auth.signOut();
  });

  // ── Tab 切換 ──
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      loadMeetings();
    });
  });

  // ── 載入會議列表 ──
  async function loadMeetings() {
    const container = document.getElementById('meetings-container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>載入中...</div>';

    let meetings = [], bookings = [];

    const { data: m } = await sb.from('meetings').select('*').order('created_at', { ascending: false });
    meetings = m || [];

    const now = new Date();

    if (currentTab === 'all') {
      // 全部會議：
      // 隱藏條件（非自己建立）：已截止（不論是否確認）
      // 自己建立的永遠顯示
      meetings = meetings.filter(m => {
        if (m.created_by === currentUser.id) return true; // 自己建立的永遠顯示
        const deadline = m.vote_deadline ? new Date(m.vote_deadline) : null;
        if (deadline && now > deadline) return false; // 已截止（含已確認）→ 隱藏
        return true;
      });
    } else if (currentTab === 'mine') {
      const { data: b } = await sb.from('bookings').select('meeting_id').eq('user_id', currentUser.id);
      bookings = b || [];
      const myIds = new Set(bookings.map(b => b.meeting_id));
      // 也包含自己建立的會議
      meetings = meetings.filter(m => myIds.has(m.id) || m.created_by === currentUser.id);
    }

    if (!meetings.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📅</div>
          <p>${currentTab === 'mine' ? '你還沒有預約任何會議' : '目前沒有會議'}</p>
          ${currentTab === 'all' ? '<button class="btn btn-primary btn-sm" onclick="openModal(\'modal-new-meeting\')">建立第一個會議</button>' : ''}
        </div>`;
      return;
    }

    // 若是「我的預約」頁，取得此用戶的 bookings 和對應的 confirmed_slot
    let myBookingMap = {};
    let slotNameMap = {};

    // 載入當前用戶的所有投票記錄（用於顯示「已填寫」標記）
    const { data: myBk } = await sb.from('bookings').select('*').eq('user_id', currentUser.id);
    (myBk || []).forEach(b => { myBookingMap[b.meeting_id] = b; });

    if (currentTab === 'mine') {
      // 取得所有確認時段的名稱
      const confirmedSlotIds = meetings.map(m => m.confirmed_slot_id).filter(Boolean);
      if (confirmedSlotIds.length) {
        const { data: confirmedSlots } = await sb.from('time_slots').select('*').in('id', confirmedSlotIds);
        (confirmedSlots || []).forEach(s => { slotNameMap[s.id] = s; });
      }
    }

    container.innerHTML = '<div class="meetings-grid">' +
      meetings.map(m => {
        const deadline = m.vote_deadline ? new Date(m.vote_deadline) : null;
        const isClosed = deadline && now > deadline;
        const confirmedSlot = m.confirmed_slot_id && slotNameMap[m.confirmed_slot_id];
        const myBooking = myBookingMap[m.id];
        const hasVoted = !!myBooking;
        const canVote = !isClosed && !confirmedSlot;
        return `
        <div class="meeting-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">
            <h3 style="margin:0">${escHtml(m.title)}</h3>
            <div style="display:flex;gap:6px;flex-shrink:0">
              ${confirmedSlot ? `<span class="badge badge-confirmed">✓ 已確認</span>` : ''}
              ${!confirmedSlot && isClosed ? `<span class="badge badge-closed">⏰ 已截止</span>` : ''}
              ${!confirmedSlot && !isClosed ? `<span class="badge badge-open">● 投票中</span>` : ''}
              ${canVote && hasVoted ? `<span class="badge" style="background:rgba(74,222,128,0.12);color:var(--success);border:1px solid rgba(74,222,128,0.3)">✓ 已填寫</span>` : ''}
            </div>
          </div>
          <div class="meeting-meta">
            <span>👤 ${escHtml(m.organizer)}</span>
            <span>📍 ${escHtml(m.location)}</span>
            <span>🕐 建立於 ${new Date(m.created_at).toLocaleDateString('zh-TW')}</span>
          </div>
          ${deadline ? `<div style="font-size:0.82rem;padding:6px 10px;border-radius:6px;margin-bottom:10px;display:inline-flex;align-items:center;gap:5px;${isClosed ? 'background:rgba(248,113,113,0.1);color:var(--danger);border:1px solid rgba(248,113,113,0.3)' : 'background:rgba(251,191,36,0.1);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)'}">⏱ ${isClosed ? '投票已截止：' : '截止日期：'}${deadline.toLocaleDateString('zh-TW', {year:'numeric',month:'numeric',day:'numeric'})} ${deadline.toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'})}</div>` : ''}
          ${m.description ? `<p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px">${escHtml(m.description)}</p>` : ''}
          ${confirmedSlot ? `<div class="confirmed-banner">📅 最終會議時間：${formatDate(confirmedSlot.slot_date)} ${confirmedSlot.slot_start.slice(0,5)} – ${confirmedSlot.slot_end.slice(0,5)}</div>` : ''}
          ${currentTab === 'mine' && myBooking ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:12px">你的回應：已勾選 ${(myBooking.slot_ids||[]).length} 個時段</div>` : ''}
          <div class="meeting-actions">
            ${canVote ? `<button class="btn btn-primary btn-sm" onclick="openBookModal('${m.id}', '${escAttr(m.title)}', '${escAttr(m.description || '')}')">${hasVoted ? '✏️ 修改回應' : '填寫時段'}</button>` : ''}
            <button class="btn-share" onclick="openShareModal('${m.id}')">🔗 分享</button>
            ${confirmedSlot ? `<button class="btn-outlook" onclick="exportToOutlook('${escAttr(m.title)}','${escAttr(m.description||'')}','${escAttr(m.location)}','${confirmedSlot.slot_date}','${confirmedSlot.slot_start}','${confirmedSlot.slot_end}','${escAttr(m.organizer)}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="17" rx="2" stroke="#0078d4" stroke-width="2"/><path d="M3 9h18" stroke="#0078d4" stroke-width="2"/><path d="M8 2v4M16 2v4" stroke="#0078d4" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15" r="2" fill="#0078d4"/></svg>加入 Outlook</button>` : ''}
            ${m.created_by === currentUser.id ? `<button class="btn btn-outline btn-sm" onclick="openStatsModal('${m.id}', '${escAttr(m.title)}')">📊 統計</button>` : ''}
            ${m.created_by === currentUser.id ? `<button class="btn btn-danger btn-sm" onclick="deleteMeeting('${m.id}')">刪除</button>` : ''}
          </div>
        </div>`;
      }).join('') + '</div>';
  }

  // ── 新增時段列 ──
  document.getElementById('btn-add-slot').addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'slot-row';
    row.innerHTML = `
      <input type="date" class="slot-date-input" />
      <input type="time" class="slot-start-input" />
      <input type="time" class="slot-end-input" />
      <button class="remove-slot" onclick="removeSlot(this)">×</button>`;
    document.getElementById('slot-inputs').appendChild(row);
  });

  function removeSlot(btn) {
    const rows = document.querySelectorAll('.slot-row');
    if (rows.length > 1) btn.closest('.slot-row').remove();
    else toast('至少保留一個時段', 'error');
  }

  // ── 建立會議 ──
  document.getElementById('btn-create-meeting').addEventListener('click', async () => {
    const title    = document.getElementById('nm-title').value.trim();
    const organizer= document.getElementById('nm-organizer').value.trim();
    const location = document.getElementById('nm-location').value.trim();
    const desc     = document.getElementById('nm-desc').value.trim();

    if (!title || !organizer || !location) return toast('請填寫必填欄位', 'error');

    const slots = [...document.querySelectorAll('.slot-row')].map(row => ({
      date : row.querySelector('.slot-date-input').value,
      start: row.querySelector('.slot-start-input').value,
      end  : row.querySelector('.slot-end-input').value,
    })).filter(s => s.date && s.start && s.end);

    if (!slots.length) return toast('請至少新增一個完整時段', 'error');

    const deadlineVal = document.getElementById('nm-deadline').value;
    const vote_deadline = deadlineVal ? new Date(deadlineVal).toISOString() : null;

    const { data: meeting, error: me } = await sb.from('meetings').insert({
      title, organizer, location,
      description: desc || null,
      vote_deadline,
      created_by: currentUser.id
    }).select().single();

    if (me) return toast(me.message, 'error');

    const slotRows = slots.map(s => ({
      meeting_id: meeting.id,
      slot_date : s.date,
      slot_start: s.start,
      slot_end  : s.end,
    }));

    const { error: se } = await sb.from('time_slots').insert(slotRows);
    if (se) return toast(se.message, 'error');

    toast('會議建立成功！');
    closeModal('modal-new-meeting');
    resetNewMeetingForm();
    loadMeetings();
    setTimeout(() => openShareModal(meeting.id), 500);
  });

  function resetNewMeetingForm() {
    ['nm-title','nm-organizer','nm-location','nm-desc'].forEach(id => document.getElementById(id).value = '');
    clearDeadline();
    document.getElementById('slot-inputs').innerHTML = `
      <div class="slot-row">
        <input type="date" class="slot-date-input" />
        <input type="time" class="slot-start-input" />
        <input type="time" class="slot-end-input" />
        <button class="remove-slot" onclick="removeSlot(this)">×</button>
      </div>`;
  }

  // ── 截止時間快速選項 ──
  function clearDeadline() {
    document.getElementById('nm-deadline').value = '';
    document.getElementById('nm-deadline').style.display = 'none';
    const display = document.getElementById('nm-deadline-display');
    display.style.display = 'none';
    document.querySelectorAll('.deadline-preset').forEach(b => b.classList.remove('active'));
  }

  function setDeadlineHours(hours, btn) {
    const d = new Date(Date.now() + hours * 3600000);
    // 轉成 datetime-local 格式 (YYYY-MM-DDTHH:MM)
    const pad = n => String(n).padStart(2,'0');
    const local = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    document.getElementById('nm-deadline').value = local;
    document.getElementById('nm-deadline').style.display = 'none';
    const display = document.getElementById('nm-deadline-display');
    display.style.display = 'flex';
    document.getElementById('nm-deadline-text').textContent = `⏱ 截止：${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`;
    document.querySelectorAll('.deadline-preset').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  document.getElementById('deadline-presets').addEventListener('click', e => {
    const btn = e.target.closest('.deadline-preset');
    if (!btn) return;
    if (btn.dataset.custom) {
      // 自訂：顯示 datetime-local 輸入
      document.getElementById('nm-deadline').style.display = 'block';
      document.getElementById('nm-deadline-display').style.display = 'none';
      document.querySelectorAll('.deadline-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('nm-deadline').focus();
      // 監聽自訂輸入變動
      document.getElementById('nm-deadline').onchange = function() {
        if (this.value) {
          const d = new Date(this.value);
          document.getElementById('nm-deadline-display').style.display = 'flex';
          document.getElementById('nm-deadline-text').textContent = `⏱ 截止：${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`;
          this.style.display = 'none';
        }
      };
    } else {
      setDeadlineHours(parseInt(btn.dataset.hours), btn);
    }
  });

  // ── 自動偵測截止並刷新 ──
  (function startDeadlineWatcher() {
    setInterval(async () => {
      // 只在 app 頁面且有載入會議時執行
      if (document.getElementById('app').style.display === 'none') return;
      // 重新載入，loadMeetings 內部會自動過濾截止的會議
      loadMeetings();
    }, 60000); // 每分鐘檢查一次
  })();

  // ── 開啟預約 Modal ──
  async function openBookModal(meetingId, title, desc) {
    bookingMeetingId = meetingId;
    document.getElementById('book-title').textContent = title;
    document.getElementById('book-desc').textContent = desc;
    document.getElementById('book-email').value = currentUser.email || '';

    // 載入現有回應（若有）
    const { data: existing } = await sb.from('bookings')
      .select('*').eq('meeting_id', meetingId).eq('user_id', currentUser.id).maybeSingle();

    if (existing) {
      document.getElementById('book-name').value = existing.user_name || '';
      document.getElementById('book-email').value = existing.user_email || currentUser.email || '';
      document.getElementById('book-attendees').value = existing.attendees || 1;
      document.getElementById('book-note').value = existing.note || '';
    } else {
      document.getElementById('book-name').value = '';
      document.getElementById('book-attendees').value = 1;
      document.getElementById('book-note').value = '';
    }

    const prevIds = new Set(existing?.slot_ids || []);

    const { data: slots } = await sb.from('time_slots')
      .select('*').eq('meeting_id', meetingId)
      .order('slot_date').order('slot_start');

    const slotList = document.getElementById('book-slots');
    if (!slots || !slots.length) {
      slotList.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem">此會議尚未設定時段</p>';
    } else {
      slotList.innerHTML = slots.map(s => {
        const isSelected = prevIds.has(s.id);
        return `
        <label class="slot-item ${isSelected ? 'selected' : ''}" onclick="this.classList.toggle('selected')">
          <input type="checkbox" value="${s.id}" ${isSelected ? 'checked' : ''} />
          <div>
            <div class="slot-date">${formatDate(s.slot_date)}</div>
            <div class="slot-time">${s.slot_start.slice(0,5)} – ${s.slot_end.slice(0,5)}</div>
          </div>
        </label>`;
      }).join('');
    }

    // 若已投票，顯示「更新回應」提示
    const submitBtn = document.getElementById('btn-submit-booking');
    if (existing) {
      submitBtn.textContent = '更新回應';
      let alreadyMsg = document.getElementById('book-already-msg');
      if (!alreadyMsg) {
        alreadyMsg = document.createElement('div');
        alreadyMsg.id = 'book-already-msg';
        alreadyMsg.style.cssText = 'background:rgba(74,222,128,0.1);border:1px solid var(--success);border-radius:8px;padding:12px;margin-bottom:16px;font-size:0.85rem;color:var(--success)';
        submitBtn.parentNode.insertBefore(alreadyMsg, submitBtn);
      }
      alreadyMsg.style.display = 'block';
      alreadyMsg.textContent = '✓ 你已填寫過回應，可修改後重新送出。';
    } else {
      submitBtn.textContent = '確認預約';
      const alreadyMsg = document.getElementById('book-already-msg');
      if (alreadyMsg) alreadyMsg.style.display = 'none';
    }

    openModal('modal-book');
  }

  // ── 送出預約 ──
  document.getElementById('btn-submit-booking').addEventListener('click', async () => {
    const name      = document.getElementById('book-name').value.trim();
    const email     = document.getElementById('book-email').value.trim();
    const attendees = parseInt(document.getElementById('book-attendees').value) || 1;
    const note      = document.getElementById('book-note').value.trim();
    const slotIds   = [...document.querySelectorAll('#book-slots input:checked')].map(i => i.value);

    if (!name || !email) return toast('請填寫姓名和 Email', 'error');
    if (!slotIds.length) return toast('請選擇至少一個時段', 'error');

    const { error } = await sb.from('bookings').upsert({
      meeting_id : bookingMeetingId,
      user_id    : currentUser.id,
      user_name  : name,
      user_email : email,
      slot_ids   : slotIds,
      attendees,
      note: note || null,
    }, { onConflict: 'meeting_id,user_id' });

    if (error) return toast(error.message, 'error');

    toast('回應已送出！');
    closeModal('modal-book');
    loadMeetings();
  });

  // ── 刪除會議 ──
  async function deleteMeeting(id) {
    if (!confirm('確定要刪除這個會議嗎？')) return;
    const { error } = await sb.from('meetings').delete().eq('id', id);
    if (error) return toast(error.message, 'error');
    toast('已刪除');
    loadMeetings();
  }

  // ── Modal 工具 ──
  document.getElementById('btn-new-meeting').addEventListener('click', () => openModal('modal-new-meeting'));

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.dataset.close));
  });
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  // ── 工具函式 ──
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
  function formatDate(d) {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });
  }
  function formatDateShort(d) {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });
  }
</script>
</body>
</html>
